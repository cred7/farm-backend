services:
  image_db:
    image: postgres:latest
    container_name: postgres_image_db
    environment:
      POSTGRES_DB: image
      POSTGRES_USER: image
      POSTGRES_PASSWORD: image
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5111:5432"
    networks:
      - app_network

  redis:
    image: redis:latest
    container_name: redis_image_cache
    ports:
      - "6379:6379"
    networks:
      - app_network

  backend:
    build: .
    container_name: django_image_backend
    command: sh -c "python manage.py makemigrations image && python manage.py migrate && daphne -b 0.0.0.0 -p 8000 backend.asgi:application"
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      - image_db
      - redis
    networks:
      - app_network

  celery:
    build: .
    command: celery -A backend worker -l info --pool=solo
    depends_on:
      - redis
    volumes:
      - .:/app
    networks:
      - app_network
  frontend:
    build:
      context: C:/Users/elvis/Desktop/natives/farm
    container_name: expo_image_frontend
    command: npm run start # your package.json should have "start": "expo start"
    ports:
      - "19000:19000" # Metro dev server
      - "19001:19001" # Dev tools
      - "8081:8081" # Optional if using Web browser view
    # volumes:
    # - C:/Users/elvis/Desktop/natives/farm:/app
    # - /app/node_modules # prevent overwriting node_modules with host's (if it exists)
    working_dir: /app
    stdin_open: true
    tty: true
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "8080:80" # public entry point
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
